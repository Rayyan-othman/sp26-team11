<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — AutoBid</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css"/>
</head>

<body class="d-flex h-100 text-center text-white">
  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">

    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0 fw-bold">AutoBid</h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link active" href="./login.html">Login</a>
          <a class="nav-link" href="./signup.html">Sign Up</a>
        </nav>
      </div>
    </header>

    <main class="px-3">
      <div class="glass p-4 text-start">

        <h1 class="h3 fw-bold mb-1">Login</h1>
        <p class="small opacity-75 mb-3">Checks account from the Neon database.</p>

        <div id="msg" class="small mb-3" style="display:none;"></div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Role</label>
          <select id="role" class="form-select">
            <option value="CUSTOMER">Customer</option>
            <option value="PROVIDER">Provider</option>
            <option value="ADMIN">System Admin</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Email</label>
          <input id="email" class="form-control" placeholder="customer@demo.com">
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Password</label>
          <input id="password" type="password" class="form-control" placeholder="123456">
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn btn-light" href="./signup.html">Create account</a>
          <button class="btn btn-accent" onclick="login()">Login</button>
        </div>

      </div>
    </main>

    <footer class="mt-auto text-white-50">
      <p class="mb-0 small">AutoBid</p>
    </footer>
  </div>

<script>
  const API_BASE = "http://localhost:8080";

  const last = localStorage.getItem("lastSignupEmail");
  if (last) {
    document.getElementById("email").value = last;
  }

  function showMsg(text, ok = true) {
    const el = document.getElementById("msg");
    el.style.display = "block";
    el.style.color = ok ? "rgba(255,255,255,0.85)" : "#ffb4b4";
    el.textContent = text;
  }

  async function login() {
    const role = document.getElementById("role").value;
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMsg("Please enter email and password.", false);
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/admin/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json, text/plain, */*"
        },
        body: JSON.stringify({
          email: email,
          password: password,
          role: role
        })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "Login failed.");
      }

      const found = await response.json();

      localStorage.setItem("currentUser", JSON.stringify({
        id: found.id,
        name: found.name,
        email: found.email,
        role: found.role
      }));

      showMsg("Login successful! Redirecting...", true);

      setTimeout(() => {
        routeByRole(found.role);
      }, 600);

    } catch (error) {
      showMsg("Error: " + error.message, false);
    }
  }

  function routeByRole(role) {
    const normalizedRole = String(role || "").toUpperCase();

    if (normalizedRole === "CUSTOMER") {
      location.href = "../Customer/customerdashboard.html";
    } else if (normalizedRole === "PROVIDER") {
      location.href = "../Provider/dashboard.html";
    } else if (normalizedRole === "ADMIN") {
      location.href = "../SystemAdmin/admindashboard.html";
    } else {
      showMsg("Unknown role. Cannot route user.", false);
    }
  }
</script>
</body>
</html>
