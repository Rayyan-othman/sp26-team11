<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign Up — AutoBid</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css"/>
</head>

<body class="d-flex h-100 text-center text-white">
  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">

    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0 fw-bold">AutoBid</h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link" href="./login.html">Login</a>
          <a class="nav-link active" href="./signup.html">Sign Up</a>
        </nav>
      </div>
    </header>

    <main class="px-3">
      <div class="glass p-4 text-start">

        <h1 class="h3 fw-bold mb-1">Create Account</h1>
        <p class="small opacity-75 mb-3">
          Account will be saved to Neon database.
        </p>

        <div id="msg" class="small mb-3" style="display:none;"></div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Role</label>
          <select id="role" class="form-select">
            <option value="CUSTOMER">Customer</option>
            <option value="PROVIDER">Provider</option>
            <option value="ADMIN">System Admin</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Name</label>
          <input id="name" class="form-control" placeholder="Your full name">
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Email</label>
          <input id="email" class="form-control" placeholder="name@email.com">
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Create a password">
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn btn-light" href="./login.html">Back to login</a>
          <button class="btn btn-accent" onclick="signup()">Create Account</button>
        </div>

      </div>
    </main>

    <footer class="mt-auto text-white-50">
      <p class="mb-0 small">AutoBid</p>
    </footer>
  </div>

<script>
  const API_BASE = "http://localhost:8080";

  function showMsg(text, ok = true) {
    const el = document.getElementById("msg");
    el.style.display = "block";
    el.style.color = ok ? "rgba(255,255,255,0.85)" : "#ff4d4d";
    el.textContent = text;
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  async function signup() {
    const role = document.getElementById("role").value.toUpperCase();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
      showMsg("Fill all fields.", false);
      return;
    }

    if (!isValidEmail(email)) {
      showMsg("Invalid email format.", false);
      return;
    }

    try {
      console.log("Sending signup to backend...");

      const response = await fetch(`${API_BASE}/admin/users`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: name,
          email: email,
          password: password,
          role: role,
          accountStatus: "ACTIVE"
        })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }

      console.log("User created in Neon");

      showMsg("✅ Account created successfully!", true);

      setTimeout(() => {
        window.location.href = "./login.html";
      }, 800);

    } catch (error) {
      console.error(error);
      showMsg("❌ " + error.message, false);
    }
  }
</script>
</body>
</html>
