<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin Dashboard</title>
    <link rel="stylesheet" href="/css/admindashboard.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
        }

        .section {
            background: #1c1c1c;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #222;
        }

        th, td {
            border: 1px solid #444;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #a00000;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #2a2a2a;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
        }

        button {
            background-color: #a00000;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            background-color: #c40000;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>System Admin Dashboard</h1>

        <div class="section">
            <h2>All Users</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                </tbody>
            </table>
            <p id="loadMessage" class="message"></p>
        </div>

        <div class="section">
            <h2>Create User</h2>
            <input type="text" id="name" placeholder="Enter name">
            <input type="email" id="email" placeholder="Enter email">
            <input type="text" id="role" placeholder="Enter role">
            <button onclick="createUser()">Create User</button>
            <p id="createMessage" class="message"></p>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const tableBody = document.getElementById("userTableBody");
            const loadMessage = document.getElementById("loadMessage");

            tableBody.innerHTML = "";
            loadMessage.textContent = "Loading users...";

            try {
                const response = await fetch("/admin/users");

                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                const users = await response.json();

                if (users.length === 0) {
                    loadMessage.textContent = "No users found.";
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name || ""}</td>
                        <td>${user.email || ""}</td>
                        <td>${user.role || ""}</td>
                        <td>
                            <button onclick="viewUser(${user.id})">View</button>
                            <button onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    `;

                    tableBody.appendChild(row);
                });

                loadMessage.textContent = "Users loaded from database.";
            } catch (error) {
                loadMessage.textContent = "Error: " + error.message;
            }
        }

        async function viewUser(id) {
            try {
                const response = await fetch(`/admin/users/${id}`);

                if (!response.ok) {
                    throw new Error("Failed to fetch user");
                }

                const user = await response.json();

                alert(
                    `User Details\n\n` +
                    `ID: ${user.id}\n` +
                    `Name: ${user.name || ""}\n` +
                    `Email: ${user.email || ""}\n` +
                    `Role: ${user.role || ""}`
                );
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        async function deleteUser(id) {
            const confirmed = confirm("Are you sure you want to delete this user?");
            if (!confirmed) return;

            try {
                const response = await fetch(`/admin/users/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Failed to delete user");
                }

                alert("User deleted successfully.");
                loadUsers();
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        async function createUser() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const role = document.getElementById("role").value.trim();
            const createMessage = document.getElementById("createMessage");

            if (!name || !email || !role) {
                createMessage.textContent = "Please fill in all fields.";
                return;
            }

            try {
                const response = await fetch("/admin/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, role })
                });

                if (!response.ok) {
                    throw new Error("Failed to create user");
                }

                createMessage.textContent = "User created successfully.";

                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("role").value = "";

                loadUsers();
            } catch (error) {
                createMessage.textContent = "Error: " + error.message;
            }
        }

        loadUsers();
    </script>
</body>
</html>
