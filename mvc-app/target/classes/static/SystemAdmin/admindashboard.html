<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body style="background:#111;color:white;font-family:Arial,sans-serif;padding:20px;">

    <h1 style="color:red;">NEW DYNAMIC ADMIN DASHBOARD</h1>
    <h2>Users From Database</h2>

    <button onclick="loadUsers()">Reload Users</button>

    <table border="1" cellpadding="10" cellspacing="0" style="margin-top:20px;width:100%;border-collapse:collapse;background:#222;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>

    <p id="msg"></p>

    <script>
        async function loadUsers() {
            const tbody = document.getElementById("userTableBody");
            const msg = document.getElementById("msg");
            tbody.innerHTML = "";
            msg.textContent = "Loading...";

            try {
                const response = await fetch("/admin/users");
                if (!response.ok) {
                    throw new Error("Failed to load users: " + response.status);
                }

                const users = await response.json();

                if (users.length === 0) {
                    msg.textContent = "No users found in database.";
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${user.id ?? ""}</td>
                        <td>${user.name ?? ""}</td>
                        <td>${user.email ?? ""}</td>
                        <td>${user.role ?? ""}</td>
                    `;
                    tbody.appendChild(row);
                });

                msg.textContent = "Loaded users from database.";
            } catch (error) {
                msg.textContent = error.message;
            }
        }

        loadUsers();
    </script>
</body>
</html>
