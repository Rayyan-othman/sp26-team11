<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AutoBid Provider Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- same CSS you’re already using -->
  <link rel="stylesheet" href="../css/provider-style.css">
</head>
<body class="d-flex h-100 text-center text-white">
  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0 fw-bold">AutoBid</h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
        <a class="nav-link" href="dashboard.html">DashBoard</a></nav>
      </div>
    </header>

    <main class="px-3 w-100 d-flex justify-content-center align-items-center">
      <div class="glass p-4" style="max-width: 420px; width: 100%;">
        <h1 class="h3 mb-3 fw-bold">Provider Login</h1>

        <form onsubmit="handleLogin(event)">
          <div class="mb-3 text-start">
            <label class="form-label" for="providerEmail">Email</label>
            <input id="providerEmail" type="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="mb-3 text-start">
            <label class="form-label" for="providerPassword">Password</label>
            <input id="providerPassword" type="password" class="form-control" placeholder="Enter password" required>
          </div>

          <button type="submit" class="btn btn-accent w-100 mt-2">
            Log In
          </button>
        </form>

        <p class="mt-3 mb-0 small text-white-50">
          UI-only prototype – login is not real, just redirects to dashboard.
        </p>
      </div>
    </main>

    <footer class="mt-auto text-white-50">
      <p class="mb-0 small">AutoBid • Provider Login</p>
    </footer>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      // simple prototype redirect to provider dashboard
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
