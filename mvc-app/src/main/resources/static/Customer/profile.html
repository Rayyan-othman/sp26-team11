<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoBid • My Profile</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .btn { display:inline-block; text-align:center; text-decoration:none; padding:10px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); color:inherit; font-weight:600; cursor:pointer; }
    .btn:hover{ filter:brightness(1.08); }
    .btn-primary{ background:rgba(255,0,84,.20); border-color:rgba(255,0,84,.35); }
    .muted{ opacity:.8; }
    .small{ font-size:.9rem; }
    .form-group{ margin-bottom:18px; }
    .form-group label{ display:block; font-size:.85rem; opacity:.75; margin-bottom:6px; }
    .form-group input { width:100%; padding:10px 14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); border-radius:10px; color:#fff; font-size:.95rem; box-sizing:border-box; }
    .form-group input::placeholder{ color:rgba(255,255,255,.4); }
    .form-group input:focus{ outline:none; border-color:rgba(225,29,72,.55); box-shadow:0 0 0 .2rem rgba(225,29,72,.18); }
    #msg{ font-size:.9rem; padding:10px 14px; border-radius:10px; display:none; margin-bottom:16px; }
    .profile-header{ display:flex; align-items:center; gap:16px; margin-bottom:24px; }
    .avatar{ width:60px; height:60px; border-radius:50%; background:rgba(225,29,72,.25); border:2px solid rgba(225,29,72,.45); display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800; }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="./customerdashboard.html">AutoBid</a>
      <span class="badge">Customer</span>
      <span style="flex:1"></span>
      <a href="./customerdashboard.html">Dashboard</a>
      <a href="./browse.html">Browse</a>
      <a href="./mybookings.html">Bookings</a>
      <a href="../Auth/login.html" onclick="logout()">Logout</a>
    </div>
  </header>

  <main class="container">
    <div class="card" style="max-width:560px;">
      <div class="profile-header">
        <div class="avatar" id="avatarInitial">?</div>
        <div>
          <h1 style="margin:0;" id="profileTitle">My Profile</h1>
          <div class="muted small" id="profileRole">Customer</div>
        </div>
      </div>

      <div id="msg"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>New Password <span class="muted">(leave blank to keep current)</span></label>
        <input type="password" id="password" placeholder="New password">
      </div>

      <button class="btn btn-primary" onclick="saveProfile()" style="width:100%; padding:12px;">
        Save Changes
      </button>
    </div>
  </main>

<script>
  const API = "http://localhost:8080";
  let currentUser = null;

  function logout() { localStorage.removeItem("currentUser"); }

  function showMsg(text, ok) {
    const el = document.getElementById("msg");
    el.style.display = "block";
    el.style.color = ok ? "#a8f0cc" : "#ffb4b4";
    el.style.background = ok ? "rgba(0,255,160,.08)" : "rgba(255,80,80,.08)";
    el.style.border = ok ? "1px solid rgba(0,255,160,.2)" : "1px solid rgba(255,80,80,.2)";
    el.textContent = text;
  }

  function init() {
    const stored = localStorage.getItem("currentUser");
    if (!stored) { location.href = "../Auth/login.html"; return; }
    currentUser = JSON.parse(stored);
    document.getElementById("name").value = currentUser.name || "";
    document.getElementById("email").value = currentUser.email || "";
    document.getElementById("profileTitle").textContent = currentUser.name || "My Profile";
    document.getElementById("avatarInitial").textContent = (currentUser.name || "?")[0].toUpperCase();
  }

  async function saveProfile() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !email) { showMsg("Name and email are required.", false); return; }

    const payload = { name, email, role: "CUSTOMER", accountStatus: currentUser.accountStatus || "ACTIVE" };
    if (password) payload.password = password;

    try {
      const res = await fetch(`${API}/admin/users/${currentUser.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(await res.text());
      const updated = await res.json();
      localStorage.setItem("currentUser", JSON.stringify({
        id: updated.id, name: updated.name, email: updated.email,
        role: updated.role, accountStatus: updated.accountStatus
      }));
      currentUser = updated;
      document.getElementById("profileTitle").textContent = updated.name;
      document.getElementById("avatarInitial").textContent = (updated.name || "?")[0].toUpperCase();
      showMsg("Profile updated successfully!", true);
    } catch(e) {
      showMsg("Error: " + e.message, false);
    }
  }

  init();
</script>
</body>
</html>
