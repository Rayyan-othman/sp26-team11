<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign Up — AutoBid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<link rel="stylesheet" href="../css/styles.css">
<body class="d-flex h-100 text-center text-white">
  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">

    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0 fw-bold">AutoBid</h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link" href="./login.html">Login</a>
          <a class="nav-link active" href="./signup.html">Sign Up</a>
        </nav>
      </div>
    </header>

    <main class="px-3">
      <div class="glass p-4 text-start">
        <h1 class="h3 fw-bold mb-1">Create Account</h1>
        <p class="small opacity-75 mb-3">UI-only — hard-coded later.</p>

        <div class="mb-3">
          <label class="form-label small opacity-75">Role</label>
          <select id="role" class="form-select">
            <option value="customer">Customer</option>
            <option value="provider">Provider</option>
            <option value="admin">System Admin</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Name</label>
          <input class="form-control" placeholder="Your name">
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Email</label>
          <input class="form-control" placeholder="name@email.com">
        </div>

        <div class="mb-3">
          <label class="form-label small opacity-75">Password</label>
          <input type="password" class="form-control" placeholder="(any for prototype)">
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn btn-light" href="./login.html">Back to login</a>
          <button class="btn btn-accent" onclick="go()">Create</button>
        </div>
      </div>
    </main>

    <footer class="mt-auto text-white-50">
      <p class="mb-0 small">After create → routes to role dashboard (prototype)</p>
    </footer>

  </div>

  <script>
    function go(){
      const r = document.getElementById('role').value;
      if(r === 'customer') location.href = "../customer/dashboard.html";
      if(r === 'provider') location.href = "../provider/dashboard.html";
      if(r === 'admin') location.href = "../admin/dashboard.html";
    }
  </script>
</body>
</html>
