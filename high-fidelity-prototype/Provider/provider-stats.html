<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AutoBid Provider Statistics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/provider-style.css">
</head>
<body class="d-flex h-100 text-center text-white">
  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0 fw-bold">AutoBid</h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link active" href="provider-stats.html">Statistics</a>
          <a class="nav-link" href="provider-login.html">Logout</a>
        </nav>
      </div>
    </header>

    <main class="px-3 w-100">
      <h1 class="fw-bold mb-4">Provider Statistics</h1>

      <div class="glass p-4 mb-4 text-start">
        <h4>Rating Overview</h4>
        <div id="avgRating" class="output mb-3"></div>
      </div>

      <div class="glass p-4 mb-4 text-start">
        <h4>Booking History</h4>
        <div id="bookingList" class="output mb-3"></div>
      </div>

      <div class="glass p-4 mb-4 text-start">
        <h4>Bookings per Service</h4>
        <div id="serviceCounts" class="output"></div>
      </div>
    </main>

    <footer class="mt-auto text-white-50">
      <p class="mb-0 small">AutoBid • Statistics prototype • hard-coded placeholder data</p>
    </footer>
  </div>

  <script>
    // same placeholder data as dashboard
    const bookingHistory = [
      { service: "Oil Change",   customer: "Alice",   rating: 5, date: "2026-02-10" },
      { service: "Car Wash",     customer: "Bob",     rating: 4, date: "2026-02-12" },
      { service: "Brake Check",  customer: "Charlie", rating: 5, date: "2026-02-15" },
      { service: "Tire Rotation",customer: "Diana",   rating: 4, date: "2026-02-16" }
    ];

    function renderStats() {
      // average rating
      const avg = bookingHistory.reduce((a, b) => a + b.rating, 0) / bookingHistory.length;
      document.getElementById("avgRating").innerText =
        `Average Rating: ${avg.toFixed(2)} / 5\nTotal Bookings: ${bookingHistory.length}`;

      // booking history list
      const historyText = bookingHistory
        .map(b => `${b.date}: ${b.customer} booked ${b.service} (Rating: ${b.rating})`)
        .join("\n");
      document.getElementById("bookingList").innerText = historyText;

      // bookings per service
      const counts = {};
      bookingHistory.forEach(b => {
        counts[b.service] = (counts[b.service] || 0) + 1;
      });
      let countsText = "";
      Object.keys(counts).forEach(service => {
        countsText += `${service}: ${counts[service]} bookings\n`;
      });
      document.getElementById("serviceCounts").innerText = countsText;
    }

    renderStats();
  </script>
</body>
</html>
